<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 90" fill="none">
  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="roseGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97A94"/>
      <stop offset="50%" stop-color="#C86D85"/>
      <stop offset="100%" stop-color="#AF536D"/>
    </linearGradient>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5F7"/>
      <stop offset="100%" stop-color="#FCE7EC"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5A6B6"/>
      <stop offset="100%" stop-color="#C46780"/>
    </linearGradient>
  </defs>

  <!-- Circular Emblem with Stylized M & Crescent Moon -->
  <g transform="translate(10, 8)">
    <!-- Soft circular badge -->
    <circle cx="37" cy="37" r="36" fill="url(#bgGradient)" stroke="#F2BDCB" stroke-width="1.5" />
    
    <!-- Delicate crescent moon curve on the top-right -->
    <path d="M52 20 C58 28 56 42 47 49 C44 51 40 53 35 54 C46 51 51 38 46 27 C44 23 41 21 38 19 C43 19 48 19 52 20 Z" 
          fill="url(#goldAccent)" opacity="0.45" />

    <!-- Stylized Calligraphic "M" in signature Dusty Rose -->
    <path d="M22 52 
             C20 52 19 50 19 47 
             C20 41 23 32 26 23 
             C27 20 29 19 32 20 
             C34 21 34 24 33 28 
             C31 35 28 44 26 49 
             C29 43 33 34 37 25 
             C39 21 42 21 44 24 
             C47 29 49 37 51 46 
             C53 38 56 31 58 26 
             C60 22 62 23 63 25 
             C64 28 62 33 60 38 
             C57 44 54 50 51 52 
             C48 53 46 51 45 47 
             C43 40 40 31 38 27 
             C35 34 31 43 28 49 
             C27 51 25 52 22 52 Z" 
          fill="url(#roseGradient)" />

    <!-- Tiny sparkle star -->
    <path d="M56 16 L57 19 L60 20 L57 21 L56 24 L55 21 L52 20 L55 19 Z" fill="#D97A94" opacity="0.75" />
  </g>

  <!-- Typography: MOON STORE -->
  <text x="96" y="44" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
        font-size="26" font-weight="700" letter-spacing="3" fill="#3D1B27">
    MOON STORE
  </text>
  
  <!-- Subtitle: TIENDA PARA MUJERES -->
  <text x="98" y="62" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
        font-size="9" font-weight="600" letter-spacing="3.5" fill="#C86D85">
    TIENDA PARA MUJERES
  </text>
</svg>
